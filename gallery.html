
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lesotho Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
        }

        .navbar {
            background-color: #00209F !important;
            padding: 15px 0;
        }

        .navbar .nav-link {
            color: #ffffff !important;
            transition: 0.3s;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #009543 !important;
        }

        main {
            min-height: 80vh;
        }

        h1 {
            color: #00209F;
            font-weight: bold;
        }

        .gallery-intro {
            color: #333333;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            margin-top: 30px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 14px;
            background: #ffffff;
            border-bottom: 5px solid #009543;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.14);
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.4s;
        }

        .gallery-item img:hover {
            transform: scale(1.05);
        }

        .modal-content {
            border: 3px solid #009543;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-header {
            background-color: #00209F;
            color: #ffffff;
        }

        .modal-title {
            color: #ffffff;
        }

        .btn-close {
            filter: invert(1);
        }

        .modal-body {
            background-color: #000000;
        }

        #previewImage {
            max-height: 75vh;
            object-fit: contain;
        }

        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 22px;
            border-top: 5px solid #009543;
            font-weight: bold;
            letter-spacing: 2px;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
            }

            .gallery-item img {
                height: 220px;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Open navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="text-center mb-2">Photo Gallery</h1>
    <p class="text-center mb-4 gallery-intro">Explore the beauty of the Mountain Kingdom and its beautiful nature.</p>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="Thaba busiu.jpg" alt="Thaba Bosiu" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>

        <div class="gallery-item">
            <img src="mohale.jpg" alt="Mohale Dam" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>

        <div class="gallery-item">
            <img src="liphofung.jpg" alt="Liphofung" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>

        <div class="gallery-item">
            <img src="maletsunyane.jpg" alt="Maletsunyane Falls" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>

        <div class="gallery-item">
            <img src="limmele.jpg" alt="Limele" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>

        <div class="gallery-item">
            <img src="Katse dam.jpg" alt="Katse Dam" data-bs-toggle="modal" data-bs-target="#photoModal">
        </div>
    </div>
</main>

<div class="modal fade" id="photoModal" tabindex="-1" aria-labelledby="photoModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="photoModalTitle">Photo Preview</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="previewImage" src="" alt="Selected enlarged photograph" class="img-fluid w-100">
            </div>
        </div>
    </div>
</div>

<footer>
    <p>KHOTSO! PULA! NALA!</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const galleryImages = document.querySelectorAll(".gallery-item img");
    const previewImage = document.getElementById("previewImage");

    galleryImages.forEach(function(image) {
        image.addEventListener("click", function() {
            previewImage.src = image.src;
            previewImage.alt = image.alt;
        });
    });
</script>

</body>
</html>
